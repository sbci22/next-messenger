```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTG Messenger</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #dfe5e8;
    height: 100vh;
    overflow: hidden;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    background: white;
}

/* SIDEBAR */
.sidebar {
    width: 360px;
    background: #f5f7f8;
    border-right: 1px solid #ddd;
    display: flex;
    flex-direction: column;
}

.header {
    height: 65px;
    background: #075e54;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.icons {
    font-size: 21px;
    display: flex;
    gap: 18px;
}

.search {
    padding: 12px;
    background: #f0f2f5;
}

.search input {
    width: 100%;
    padding: 11px 15px;
    border: none;
    outline: none;
    border-radius: 20px;
    background: white;
}

/* CONTACTS */
.contacts {
    overflow-y: auto;
    flex: 1;
}

.contact {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 15px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
}

.contact:hover {
    background: #e9edef;
}

.avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg,#00a884,#128c7e);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
}

.contact-info {
    flex: 1;
}

.contact-name {
    font-weight: bold;
    color: #222;
}

.last-message {
    color: #667781;
    margin-top: 5px;
    font-size: 14px;
}

/* CHAT AREA */
.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #efeae2;
}

.chat-header {
    height: 65px;
    background: #075e54;
    color: white;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
}

.chat-user {
    flex: 1;
}

.chat-user h3 {
    font-size: 17px;
}

.chat-user span {
    font-size: 12px;
    opacity: .8;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    background:
        radial-gradient(#d6d0c7 1px, transparent 1px);
    background-size: 20px 20px;
}

.message {
    max-width: 65%;
    padding: 9px 12px;
    margin-bottom: 10px;
    border-radius: 9px;
    font-size: 14px;
    position: relative;
}

.received {
    background: white;
    margin-right: auto;
}

.sent {
    background: #d9fdd3;
    margin-left: auto;
}

.time {
    font-size: 10px;
    color: #667781;
    margin-left: 8px;
}

/* INPUT */
.message-box {
    min-height: 65px;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 15px;
}

.message-box input {
    flex: 1;
    padding: 13px 18px;
    border-radius: 25px;
    border: none;
    outline: none;
    font-size: 15px;
}

.send {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    background: #075e54;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.send:hover {
    background: #128c7e;
}

/* MOBILE */
@media(max-width:700px) {

    .sidebar {
        width: 100%;
    }

    .chat {
        display: none;
    }

    .sidebar.mobile-hide {
        display: none;
    }

    .chat.mobile-show {
        display: flex;
        width: 100%;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">

        <div class="header">
            <div class="logo">LTG Messenger</div>
            <div class="icons">
                ⚙️
            </div>
        </div>

        <div class="search">
            <input
                type="text"
                id="search"
                placeholder="Search or start new chat..."
                onkeyup="searchContacts()"
            >
        </div>

        <div class="contacts" id="contacts">

            <div class="contact" onclick="openChat('Rahul')">
                <div class="avatar">R</div>
                <div class="contact-info">
                    <div class="contact-name">Rahul</div>
                    <div class="last-message">Hello bro 👋</div>
                </div>
            </div>

            <div class="contact" onclick="openChat('Anjali')">
                <div class="avatar">A</div>
                <div class="contact-info">
                    <div class="contact-name">Anjali</div>
                    <div class="last-message">See you tomorrow!</div>
                </div>
            </div>

            <div class="contact" onclick="openChat('Amit')">
                <div class="avatar">A</div>
                <div class="contact-info">
                    <div class="contact-name">Amit</div>
                    <div class="last-message">Send me the file.</div>
                </div>
            </div>

            <div class="contact" onclick="openChat('Priya')">
                <div class="avatar">P</div>
                <div class="contact-info">
                    <div class="contact-name">Priya</div>
                    <div class="last-message">Good morning ☀️</div>
                </div>
            </div>

        </div>
    </div>

    <!-- CHAT -->
    <div class="chat" id="chat">

        <div class="chat-header">
            <div class="avatar" id="chatAvatar">R</div>

            <div class="chat-user">
                <h3 id="chatName">Rahul</h3>
                <span>online</span>
            </div>

            <div>📞 &nbsp; 📹 &nbsp; ⋮</div>
        </div>

        <div class="messages" id="messages">

            <div class="message received">
                Hello bro 👋
                <span class="time">09:30</span>
            </div>

            <div class="message sent">
                Hey! How are you?
                <span class="time">09:31</span>
            </div>

            <div class="message received">
                I am good 😊
                <span class="time">09:32</span>
            </div>

        </div>

        <div class="message-box">
            <button style="border:none;background:none;font-size:22px;">😊</button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                onkeydown="handleEnter(event)"
            >

            <button class="send" onclick="sendMessage()">➤</button>
        </div>

    </div>

</div>

<script>

let currentUser = "Rahul";

function openChat(name) {

    currentUser = name;

    document.getElementById("chatName").innerText = name;
    document.getElementById("chatAvatar").innerText =
        name.charAt(0).toUpperCase();

    document.getElementById("messages").innerHTML = `
        <div class="message received">
            Hello! 👋
            <span class="time">09:30</span>
        </div>
    `;

    // Mobile view
    if(window.innerWidth <= 700) {
        document.getElementById("sidebar")
            .classList.add("mobile-hide");

        document.getElementById("chat")
            .classList.add("mobile-show");
    }
}

function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if(text === "") return;

    const message = document.createElement("div");

    message.className = "message sent";

    const time = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    message.innerHTML = `
        ${escapeHTML(text)}
        <span class="time">${time}</span>
    `;

    document.getElementById("messages").appendChild(message);

    input.value = "";

    const messages = document.getElementById("messages");

    messages.scrollTop = messages.scrollHeight;

    // Demo auto reply
    setTimeout(() => {

        const reply = document.createElement("div");

        reply.className = "message received";

        reply.innerHTML = `
            Got it 👍
            <span class="time">
                ${new Date().toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                })}
            </span>
        `;

        messages.appendChild(reply);

        messages.scrollTop = messages.scrollHeight;

    }, 1000);
}

function handleEnter(event) {

    if(event.key === "Enter") {
        sendMessage();
    }

}

function searchContacts() {

    const value =
        document.getElementById("search").value.toLowerCase();

    const contacts =
        document.querySelectorAll(".contact");

    contacts.forEach(contact => {

        const name =
            contact.querySelector(".contact-name")
            .innerText.toLowerCase();

        contact.style.display =
            name.includes(value) ? "flex" : "none";

    });
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.innerText = text;

    return div.innerHTML;
}

</script>

</body>
</html>
```
